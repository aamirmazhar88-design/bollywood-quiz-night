<!DOCTYPE html>
<html>

<head>

<title>Bollywood Quiz Night - Host</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#141E30,#243B55);
    color:white;
    text-align:center;
    min-height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
}


.box {
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:25px;
    width:80%;
    max-width:900px;
}


h1 {
    font-size:50px;
}


.pin {
    font-size:80px;
    color:#FFD700;
    font-weight:bold;
}


.question {

    font-size:40px;
    margin:30px;

}


button {

    background:#FFD700;
    border:none;
    padding:18px 40px;
    font-size:25px;
    border-radius:15px;
    cursor:pointer;
    margin:15px;

}


.players {

    font-size:25px;

}


</style>

</head>



<body>


<div class="box">


<h1>🎬 Bollywood Quiz Night</h1>


<h2>Game PIN</h2>

<div class="pin" id="gamePin">
Loading...
</div>



<div class="players">

Players Joined:
<span id="playerCount">0</span>

</div>


<div id="playerList"></div>



<button id="startBtn">
🎬 Start Game
</button>



<div id="gameArea"></div>


<button id="nextBtn" style="display:none;">
Next Question →
</button>



</div>



<script type="module">


import { database } from "./firebase.js";

import { questions } from "./questions.js";


import {

ref,
set,
onValue,
update

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";




// Create PIN

function generatePIN(){

return Math.floor(1000 + Math.random()*9000);

}



const gamePin = generatePIN();


document.getElementById("gamePin").innerText = gamePin;



const gameRef = ref(database,"games/"+gamePin);



set(gameRef,{

status:"waiting",

currentQuestion:0,

createdAt:Date.now()

});




// Players listener


const playersRef =
ref(database,"games/"+gamePin+"/players");


onValue(playersRef,(snapshot)=>{


const players=snapshot.val();


if(players){

const names=Object.values(players);


document.getElementById("playerCount").innerText =
names.length;


document.getElementById("playerList").innerHTML =
names.map(name=>"✅ "+name).join("<br>");


}


});





let currentQuestion = 0;



// Start Game


document.getElementById("startBtn").onclick = ()=>{


currentQuestion=0;


update(gameRef,{

status:"playing",

currentQuestion:currentQuestion

});


showQuestion();


};





function showQuestion(){


const q = questions[currentQuestion];


document.getElementById("gameArea").innerHTML=`

<h2>Question ${currentQuestion+1}/${questions.length}</h2>

<div class="question">

${q.question}

</div>

`;


document.getElementById("nextBtn").style.display="inline-block";


}





// Next question


document.getElementById("nextBtn").onclick=()=>{


currentQuestion++;


if(currentQuestion < questions.length){


update(gameRef,{

currentQuestion:currentQuestion

});


showQuestion();


}

else{


document.getElementById("gameArea").innerHTML=

"<h1>🏆 Game Finished!</h1>";

}


};




</script>


</body>

</html>

<!DOCTYPE html>
<html>

<head>

<title>Natasha's Bollywood Quiz Night - Host</title>


<style>

body {

font-family: Arial, sans-serif;

background:
linear-gradient(135deg,#141E30,#243B55);

color:white;

min-height:100vh;

margin:0;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}



/* FLOATING POSTERS */

.poster-wall {

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

overflow:hidden;

pointer-events:none;

z-index:0;

}


.poster {

position:absolute;

width:150px;

opacity:0.18;

filter:grayscale(40%) brightness(70%);

border-radius:20px;

animation:floatPoster 18s infinite ease-in-out;

}



.poster:nth-child(1){

left:3%;

top:10%;

}


.poster:nth-child(2){

left:5%;

top:60%;

animation-delay:4s;

}


.poster:nth-child(3){

right:4%;

top:15%;

animation-delay:2s;

}


.poster:nth-child(4){

right:6%;

top:60%;

animation-delay:6s;

}



@keyframes floatPoster {

0%{

transform:translateY(0px);

}

50%{

transform:translateY(-35px);

}

100%{

transform:translateY(0px);

}

}




.container {

position:relative;

z-index:2;

width:90%;

max-width:1000px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(15px);

padding:40px;

border-radius:30px;

text-align:center;

}



h1 {

font-size:55px;

color:#FFD700;

}



.pin {

font-size:70px;

font-weight:bold;

color:#FFD700;

}



.question {

font-size:45px;

margin:30px;

}



button {

background:#FFD700;

border:none;

padding:18px 35px;

font-size:25px;

font-weight:bold;

border-radius:15px;

cursor:pointer;

margin:10px;

}



.timer {

font-size:45px;

color:#ffdd00;

}



.leaderboard {

font-size:28px;

text-align:left;

margin-top:30px;

}



.player {

margin:10px;

}



.hidden {

display:none;

}



audio{

display:none;

}



</style>


</head>


<body>



<!-- BACKGROUND MUSIC -->

<audio id="bgMusic" loop>

<source src="assets/music/NatashaAayi.mp3" type="audio/mpeg">

</audio>



<!-- FLOATING MOVIE POSTERS -->

<div class="poster-wall">


<img class="poster" src="assets/posters/poster 1.jpeg">


<img class="poster" src="assets/posters/poster 2.jpeg">


<img class="poster" src="assets/posters/poster 3.jpeg">


<img class="poster" src="assets/posters/poster 4.jpeg">


</div>





<div class="container">


<h1>
🎬 Natasha's Bollywood Quiz Night
</h1>


<h2>Game PIN</h2>


<div class="pin" id="pin">

Loading...

</div>



<h2>
Players:
<span id="playerCount">0</span>
</h2>


<div id="playerList"></div>



<button id="startBtn">

🎬 START GAME

</button>





<div id="gameArea" class="hidden">


<h2 id="questionNumber"></h2>


<div class="timer">

⏱ <span id="timer">15</span>

</div>


<div class="question" id="question">

</div>


<h2 id="answered">

Answers: 0

</h2>


<button id="revealBtn">

👀 Reveal Results

</button>


</div>





<div id="results" class="hidden">


<h1>

🏆 Leaderboard

</h1>


<div id="leaderboard" class="leaderboard">

</div>


<button id="nextBtn">

Next Question →

</button>


</div>



</div>







<script type="module">


import { database } from "./firebase.js";

import { questions } from "./questions.js";


import {

ref,

set,

update,

onValue,

get


} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";





/* MUSIC START */

const music=document.getElementById("bgMusic");


document.addEventListener("click",()=>{

music.play();

});






function generatePIN(){

return Math.floor(1000 + Math.random()*9000);

}




const gamePin=generatePIN();



document.getElementById("pin").innerText=gamePin;



const gameRef=

ref(database,`games/${gamePin}`);





set(gameRef,{

status:"waiting",

currentQuestion:0,

createdAt:Date.now()

});





const playersRef=

ref(database,`games/${gamePin}/players`);





onValue(playersRef,(snapshot)=>{


const players=snapshot.val();


if(players){


const list=Object.values(players);



document.getElementById("playerCount").innerText=list.length;



document.getElementById("playerList").innerHTML=


list.map(p=>


`<div class="player">✅ ${p.name || p}</div>`


).join("");

}


});






let currentQuestion=0;

let timer;






document.getElementById("startBtn").onclick=()=>{


music.play();


currentQuestion=0;


update(gameRef,{

status:"playing",

currentQuestion:0

});


startQuestion();


};








function startQuestion(){


const q=questions[currentQuestion];



document.getElementById("gameArea")
.classList.remove("hidden");



document.getElementById("results")
.classList.add("hidden");



document.getElementById("questionNumber")
.innerText=

`Question ${currentQuestion+1}/${questions.length}`;



document.getElementById("question")
.innerText=q.question;



document.getElementById("answered")
.innerText="Answers: 0";



startTimer();

listenAnswers();


}






function startTimer(){


let seconds=15;


document.getElementById("timer").innerText=seconds;


clearInterval(timer);



timer=setInterval(()=>{


seconds--;


document.getElementById("timer").innerText=seconds;


if(seconds<=0){

clearInterval(timer);

}


},1000);


}







function listenAnswers(){


const answerRef=

ref(database,

`games/${gamePin}/answers/${currentQuestion}`);



onValue(answerRef,(snapshot)=>{


const answers=snapshot.val();



if(answers){


document.getElementById("answered")
.innerText=

"Answers: "+Object.keys(answers).length;


}


});


}







document.getElementById("revealBtn").onclick=async()=>{


clearInterval(timer);


const q=questions[currentQuestion];



const answerRef=

ref(database,

`games/${gamePin}/answers/${currentQuestion}`);




const snapshot=await get(answerRef);



const answers=snapshot.val() || {};



const playersSnapshot=

await get(playersRef);



const players=playersSnapshot.val();



for(const name in answers){


let score=0;



if(answers[name].answer===q.answer){


score=1000;


}



let oldScore=

players[name].score || 0;



await update(

ref(database,

`games/${gamePin}/players/${name}`),

{

score:oldScore+score

}

);


}



showLeaderboard();



};







async function showLeaderboard(){


const snapshot=await get(playersRef);



const players=snapshot.val();



let ranking=Object.values(players);



ranking.sort((a,b)=>b.score-a.score);



document.getElementById("results")
.classList.remove("hidden");



document.getElementById("gameArea")
.classList.add("hidden");



document.getElementById("leaderboard")
.innerHTML=


ranking.map((p,i)=>{


return `

<div>

${i===0?"🥇":i===1?"🥈":i===2?"🥉":"⭐"}

${p.name}

-

${p.score || 0}

</div>

`

}).join("");



}







document.getElementById("nextBtn").onclick=()=>{


currentQuestion++;



if(currentQuestion < questions.length){


update(gameRef,{

currentQuestion

});


startQuestion();


}

else{


document.getElementById("results")
.innerHTML=

"<h1>🎉 Game Finished!</h1>";

}


};





</script>



</body>

</html>

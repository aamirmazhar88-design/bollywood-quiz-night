<!DOCTYPE html>
<html>

<head>

<title>Natasha's Bollywood Birthday Quiz</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');


*{
    box-sizing:border-box;
}


body{

margin:0;

height:100vh;

overflow:hidden;

font-family:'Poppins',sans-serif;

color:white;

display:flex;

justify-content:center;

align-items:center;

background:

radial-gradient(circle at top,#ff416c,#7b1fa2 40%,#090014 90%);

}



/* MOVING LIGHTS */

body:before{

content:"";

position:absolute;

width:200%;

height:200%;

background:

linear-gradient(
120deg,
transparent 45%,
rgba(255,215,0,0.15),
transparent 55%
);

animation:lights 8s infinite linear;

}


@keyframes lights{

0%{
transform:translate(-50%,-50%) rotate(0deg);
}

100%{
transform:translate(-50%,-50%) rotate(360deg);
}

}



/* POSTERS */

.poster-wall{

position:absolute;

top:0;

height:100vh;

width:220px;

display:flex;

flex-direction:column;

gap:25px;

overflow:hidden;

z-index:1;

}



.left{

left:20px;

}


.right{

right:20px;

}



.poster{

width:150px;

border-radius:18px;

opacity:0.55;

filter:

brightness(70%)

contrast(90%);

box-shadow:

0 0 25px rgba(255,215,0,0.5);

animation:

float 8s infinite ease-in-out;

}



.poster:nth-child(even){

animation-delay:3s;

}



@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-35px);

}

}




/* MAIN CARD */


.container{

position:relative;

z-index:5;

width:650px;

padding:45px;

border-radius:35px;

background:

rgba(255,255,255,0.12);

backdrop-filter:blur(20px);

border:

1px solid rgba(255,255,255,0.3);

box-shadow:

0 0 50px rgba(0,0,0,0.5);

text-align:center;

}





h1{

font-size:48px;

margin:0;

font-weight:800;

color:#ffd700;

text-shadow:

0 0 20px #ffd700;

}



.subtitle{

font-size:20px;

margin-top:10px;

}



.pin-title{

margin-top:30px;

font-size:22px;

}



.pin{

font-size:80px;

font-weight:800;

color:#ffd700;

letter-spacing:8px;

}



.players{

font-size:24px;

margin:20px;

}



button{

background:

linear-gradient(45deg,#ffd700,#ff9f00);

border:none;

padding:18px 45px;

border-radius:50px;

font-size:24px;

font-weight:800;

cursor:pointer;

color:#111;

box-shadow:

0 0 30px rgba(255,215,0,0.7);

transition:.3s;

}



button:hover{

transform:scale(1.08);

}




.player{

font-size:22px;

margin:8px;

}



.question{

font-size:40px;

margin:30px;

}



.timer{

font-size:45px;

color:#ffd700;

}



.leaderboard{

font-size:28px;

text-align:left;

}



.hidden{

display:none;

}



audio{

display:none;

}



</style>

</head>


<body>



<!-- MUSIC -->

<audio id="bgMusic" loop>

<source src="assets/music/NatashaAayi.mp3" type="audio/mpeg">

</audio>





<!-- LEFT POSTERS -->

<div class="poster-wall left">

<img class="poster" src="assets/posters/poster01.jpeg">

<img class="poster" src="assets/posters/poster02.jpeg">

<img class="poster" src="assets/posters/poster03.jpeg">

</div>



<!-- RIGHT POSTERS -->

<div class="poster-wall right">

<img class="poster" src="assets/posters/poster04.jpeg">

<img class="poster" src="assets/posters/poster05.jpeg">

<img class="poster" src="assets/posters/poster06.jpeg">

</div>







<div class="container">


<h1>
🎬 Natasha's Bollywood Birthday Quiz
</h1>


<div class="subtitle">
A cinematic night of movies, music & memories ✨
</div>


<div class="pin-title">
GAME PIN
</div>


<div class="pin" id="pin">

Loading...

</div>



<div class="players">

Players:
<span id="playerCount">0</span>/8

</div>



<div id="playerList"></div>



<button id="startBtn">

🎬 START GAME

</button>





<div id="gameArea" class="hidden">


<h2 id="questionNumber"></h2>


<div class="timer">

⏱ <span id="timer">15</span>

</div>


<div class="question" id="question"></div>


<h2 id="answered">
Answers:0
</h2>



<button id="revealBtn">

Reveal Results 👀

</button>


</div>






<div id="results" class="hidden">


<h1>
🏆 Leaderboard
</h1>


<div id="leaderboard" class="leaderboard"></div>


<button id="nextBtn">

Next Question →

</button>


</div>


</div>







<script type="module">


import {database} from "./firebase.js";

import {questions} from "./questions.js";


import {

ref,
set,
update,
onValue,
get

}

from

"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";





const music=document.getElementById("bgMusic");



function generatePIN(){

return Math.floor(1000+Math.random()*9000);

}



const gamePin=generatePIN();


document.getElementById("pin").innerText=gamePin;



const gameRef=

ref(database,`games/${gamePin}`);



set(gameRef,{

status:"waiting",

currentQuestion:0,

createdAt:Date.now()

});





const playersRef=

ref(database,`games/${gamePin}/players`);





onValue(playersRef,(snapshot)=>{


const players=snapshot.val();


if(players){


let list=Object.values(players);



document.getElementById("playerCount").innerText=list.length;



document.getElementById("playerList").innerHTML=

list.map(p=>`<div class="player">✅ ${p.name||p}</div>`).join("");

}

});





let currentQuestion=0;

let timer;



document.getElementById("startBtn").onclick=()=>{


music.play();


currentQuestion=0;


update(gameRef,{

status:"playing",

currentQuestion:0

});


startQuestion();


};





function startQuestion(){


let q=questions[currentQuestion];


document.getElementById("gameArea").classList.remove("hidden");


document.getElementById("questionNumber").innerText=

`Question ${currentQuestion+1}/${questions.length}`;


document.getElementById("question").innerText=q.question;


startTimer();


}





function startTimer(){


let seconds=15;


clearInterval(timer);


timer=setInterval(()=>{


document.getElementById("timer").innerText=seconds;


seconds--;


if(seconds<0)

clearInterval(timer);


},1000);


}







</script>


</body>

</html>

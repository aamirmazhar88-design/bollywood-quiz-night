<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bollywood Quiz Night</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@500;700;900&display=swap');
    :root{--ink:#fff;--purple:#5b21b6;--pink:#ec4899;--yellow:#facc15;--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,sans-serif;background:radial-gradient(circle at 15% 15%,#f43f5e55,transparent 25%),radial-gradient(circle at 85% 20%,#facc1555,transparent 25%),linear-gradient(140deg,#1e1b4b,#6d28d9 55%,#be185d);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:22px 22px;opacity:.18}
    .app{width:min(920px,94vw);min-height:100vh;margin:auto;display:grid;place-items:center;padding:24px}.card{width:100%;padding:clamp(24px,5vw,54px);border:1px solid #ffffff30;border-radius:30px;background:#17113bd9;box-shadow:0 25px 70px #09051f80;text-align:center;backdrop-filter:blur(12px);animation:pop .45s ease}
    @keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}} @keyframes pulse{50%{transform:scale(1.08)}}
    .kicker{letter-spacing:.18em;text-transform:uppercase;color:#fde68a;font-weight:900}.title{font:800 clamp(3rem,9vw,6rem)/.9 "Baloo 2";margin:10px 0;text-shadow:0 6px 0 #831843}.sub{color:#ddd6fe;font-size:1.1rem}.btn{border:0;border-radius:18px;padding:16px 28px;font:900 1.15rem Inter;cursor:pointer;color:#3b0764;background:linear-gradient(135deg,#fde047,#fb923c);box-shadow:0 7px 0 #c2410c;transition:.15s;margin-top:20px}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c2410c}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:center;font-weight:900}.pill{background:#ffffff18;border-radius:999px;padding:10px 16px}.timer{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;font-size:1.6rem;background:conic-gradient(var(--yellow) var(--p),#ffffff22 0);animation:pulse 1s infinite}.question{font:800 clamp(1.45rem,4vw,2.2rem)/1.18 "Baloo 2";margin:32px auto;max-width:760px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:94px;border:0;border-radius:18px;color:white;padding:18px;font:800 clamp(.95rem,2.5vw,1.18rem) Inter;cursor:pointer;box-shadow:0 7px 0 #0005;transition:.16s}.answer:hover:not(:disabled){transform:translateY(-3px)}.answer:nth-child(1){background:#e11d48}.answer:nth-child(2){background:#2563eb}.answer:nth-child(3){background:#d97706}.answer:nth-child(4){background:#059669}.answer:disabled{opacity:.48;cursor:default}.answer.correct{opacity:1;outline:5px solid white;transform:scale(1.02)}.answer.wrong{opacity:1;background:#7f1d1d}.feedback{font:800 1.25rem "Baloo 2";min-height:66px;margin-top:22px}.muted{color:#c4b5fd;font-size:.95rem}.score-big{font:900 clamp(4rem,15vw,8rem) "Baloo 2";color:#fde047;margin:0}.confetti{position:fixed;inset:-10%;pointer-events:none;background-image:radial-gradient(circle,#fde047 0 4px,transparent 5px),radial-gradient(circle,#f472b6 0 4px,transparent 5px),radial-gradient(circle,#60a5fa 0 4px,transparent 5px);background-size:70px 80px,90px 100px,110px 75px;animation:fall 2s linear infinite}@keyframes fall{to{transform:translateY(120px) rotate(5deg)}}
    @media(max-width:620px){.answers{grid-template-columns:1fr}.answer{min-height:70px}.card{border-radius:22px}.timer{width:58px;height:58px}.top{font-size:.88rem}}
  </style>
</head>
<body><main class="app" id="app"></main>
<script>
const vault='W3sicSI6IkluIHRoZSBmaWxtIFF1ZWVuLCB3aGljaCBjaXR5IGRvZXMgUmFuaSB0cmF2ZWwgdG8gZmlyc3Qgb24gaGVyIHNvbG8gaG9uZXltb29uPyIsImEiOlsiUGFyaXMiLCJBbXN0ZXJkYW0iLCJMb25kb24iLCJSb21lIl0sImMiOjAsImYiOiJSYW5pIGJlZ2lucyBoZXIgc29sbyBob25leW1vb24gYWR2ZW50dXJlIGluIFBhcmlzLiJ9LHsicSI6IldoaWNoIGFjdG9yIHBsYXllZCBEb24gaW4gdGhlIDIwMDYgZmlsbSBEb24/IiwiYSI6WyJBcmp1biBSYW1wYWwiLCJTaGFoIFJ1a2ggS2hhbiIsIkhyaXRoaWsgUm9zaGFuIiwiQWtzaGF5IEt1bWFyIl0sImMiOjEsImYiOiJTaGFoIFJ1a2ggS2hhbiBwbGF5ZWQgRG9uIGluIHRoZSAyMDA2IHJlbWFrZS4ifSx7InEiOiJUaGUgc29uZyBHYWxsYW4gR29vZGl5YWFuIGFwcGVhcnMgaW4gd2hpY2ggZmlsbT8iLCJhIjpbIkRpbCBEaGFkYWtuZSBEbyIsIlppbmRhZ2kgTmEgTWlsZWdpIERvYmFyYSIsIkthcG9vciAmIFNvbnMiLCJCYW5kIEJhYWphIEJhYXJhYXQiXSwiYyI6MCwiZiI6IlRoZSBlbmVyZ2V0aWMgZmFtaWx5IG51bWJlciBpcyBmcm9tIERpbCBEaGFkYWtuZSBEby4ifSx7InEiOiJXaGF0IGlzIHRoZSBuYW1lIG9mIEFhbWlyIEtoYW7igJlzIGNoYXJhY3RlciBpbiAzIElkaW90cz8iLCJhIjpbIlJhanUgUmFzdG9naSIsIkZhcmhhbiBRdXJlc2hpIiwiUmFuY2hvZGRhcyBTaGFtYWxkYXMgQ2hhbmNoYWQiLCJDaGF0dXIgUmFtYWxpbmdhbSJdLCJjIjoyLCJmIjoiSGUgaXMga25vd24gYXMgUmFuY2hv4oCUUmFuY2hvZGRhcyBTaGFtYWxkYXMgQ2hhbmNoYWQuIn0seyJxIjoiV2hpY2ggZmlsbSBmZWF0dXJlcyB0aGUgZGlhbG9ndWUsIFBpY3R1cmUgYWJoaSBiYWFraSBoYWkgbWVyZSBkb3N0PyIsImEiOlsiT20gU2hhbnRpIE9tIiwiTWFpbiBIb29uIE5hIiwiQ2hlbm5haSBFeHByZXNzIiwiSGFwcHkgTmV3IFllYXIiXSwiYyI6MCwiZiI6IlRoZSBmYW1vdXMgbGluZSBpcyBmcm9tIE9tIFNoYW50aSBPbS4ifSx7InEiOiJXaG8gY29tcG9zZWQgdGhlIG11c2ljIGZvciB0aGUgZmlsbSBSb2Nrc3Rhcj8iLCJhIjpbIlByaXRhbSIsIlZpc2hhbOKAk1NoZWtoYXIiLCJBLiBSLiBSYWhtYW4iLCJTaGFua2Fy4oCTRWhzYWFu4oCTTG95Il0sImMiOjIsImYiOiJBLiBSLiBSYWhtYW4gY29tcG9zZWQgUm9ja3N0YXLigJlzIGFjY2xhaW1lZCBzb3VuZHRyYWNrLiJ9XQ==';
const questions=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(vault),c=>c.charCodeAt(0))));
let n=0,score=0,time=15,tick,locked=false;const app=document.querySelector('#app');
function sound(type){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=type==='good'?720:type==='bad'?180:440;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.22)}catch(e){}}
function home(){app.innerHTML=`<section class="card"><div class="kicker">Lights • Camera • Quiz!</div><h1 class="title">Bollywood<br>Quiz Night</h1><p class="sub">6 questions · 15 seconds each · maximum filmy drama</p><button class="btn" id="start">Start the show 🎬</button><p class="muted">Turn your sound on for tiny game effects.</p></section>`;document.querySelector('#start').onclick=()=>{sound('go');showQuestion()}}
function showQuestion(){locked=false;time=15;const q=questions[n];app.innerHTML=`<section class="card"><div class="top"><span class="pill">Question ${n+1} / ${questions.length}</span><div class="timer" style="--p:100%">15</div><span class="pill">⭐ ${score}</span></div><div class="question">${q.q}</div><div class="answers">${q.a.map((x,i)=>`<button class="answer" data-i="${i}">${['◆','●','▲','■'][i]} &nbsp; ${x}</button>`).join('')}</div><div class="feedback"></div></section>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));tick=setInterval(()=>{time--;const t=document.querySelector('.timer');t.textContent=time;t.style.setProperty('--p',`${time/15*100}%`);if(time<=0)answer(-1)},1000)}
function answer(choice){if(locked)return;locked=true;clearInterval(tick);const q=questions[n],buttons=[...document.querySelectorAll('.answer')];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct');if(i===choice&&choice!==q.c)b.classList.add('wrong')});const ok=choice===q.c;if(ok)score+=500+time*30;sound(ok?'good':'bad');document.querySelector('.feedback').innerHTML=`${ok?'✅ Correct!':choice<0?'⏰ Time’s up!':'❌ Not quite!'}<div class="muted">${q.f}</div><button class="btn" id="next">${n+1===questions.length?'See my result':'Next question →'}</button>`;document.querySelector('#next').onclick=()=>{n++;n<questions.length?showQuestion():finish()}}
function finish(){const max=questions.length*950,pct=score/max;app.innerHTML=`<div class="confetti"></div><section class="card"><div class="kicker">The credits are rolling</div><h2 class="title">${pct>.72?'Superstar! 🌟':pct>.4?'Filmy Fan! 🎞️':'Supporting Star! 🍿'}</h2><p>Your final score</p><p class="score-big">${score}</p><button class="btn" id="again">Play again 🔁</button></section>`;document.querySelector('#again').onclick=()=>{n=0;score=0;home()}}
home();
</script></body></html>

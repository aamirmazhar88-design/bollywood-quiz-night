<!DOCTYPE html>
<html>

<head>

<title>Bollywood Quiz Player</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#141E30,#243B55);
    color:white;
    min-height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
}


.box {

    background:rgba(255,255,255,0.12);
    padding:35px;
    border-radius:25px;
    width:90%;
    max-width:500px;
    text-align:center;

}


h1 {

    font-size:35px;

}


input {

    width:85%;
    padding:15px;
    margin:10px;
    border-radius:12px;
    border:none;
    font-size:20px;

}


button {

    width:90%;
    padding:18px;
    margin:10px;
    border-radius:15px;
    border:none;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;

}


.joinBtn {

    background:#FFD700;

}


.answer {

    background:#333;
    color:white;
    transition:0.2s;

}


.answer:hover {

    transform:scale(1.03);

}


.answer:disabled {

    opacity:0.5;
    cursor:not-allowed;

}


.red {

background:#e74c3c;

}


.blue {

background:#3498db;

}


.yellow {

background:#f1c40f;
color:black;

}


.green {

background:#2ecc71;

}


#questionArea {

display:none;

}


#waitingArea {

display:none;

}


.timer {

font-size:30px;
color:#FFD700;

}


</style>

</head>


<body>


<div class="box">


<h1>🎬 Bollywood Quiz Night</h1>


<!-- JOIN SCREEN -->

<div id="joinArea">

<h2>Join Game</h2>


<input id="pin"
placeholder="Game PIN">


<input id="name"
placeholder="Your Name">


<button class="joinBtn" id="join">

JOIN 🎬

</button>


</div>



<!-- WAITING SCREEN -->

<div id="waitingArea">

<h2>🎉 Joined!</h2>

<p id="playerDisplay"></p>

<h3>
Waiting for host...
</h3>

</div>



<!-- QUESTION SCREEN -->

<div id="questionArea">


<h2 id="questionNumber"></h2>


<div class="timer">

⏱ <span id="timer">15</span>

</div>


<h2 id="questionText"></h2>



<div id="answers"></div>



<p id="submitMessage"></p>



</div>



</div>





<script type="module">


import { database } from "./firebase.js";


import {

ref,
set,
onValue

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";



let gamePin;

let playerName;

let currentQuestionIndex;

let answered=false;

let startTime;




document.getElementById("join").onclick=()=>{


gamePin =
document.getElementById("pin").value;


playerName =
document.getElementById("name").value.trim();



if(!gamePin || !playerName){

alert("Please enter PIN and name");

return;

}




// Add player

set(

ref(database,
`games/${gamePin}/players/${playerName}`),

{

name:playerName,

score:0

}

);



document.getElementById("joinArea").style.display="none";

document.getElementById("waitingArea").style.display="block";

document.getElementById("playerDisplay").innerText =
"Welcome "+playerName;



listenForGame();



};





function listenForGame(){



const gameRef =
ref(database,`games/${gamePin}`);



onValue(gameRef,(snapshot)=>{


const game=snapshot.val();



if(!game) return;



if(game.status==="playing"){


loadQuestion(game.currentQuestion);


}



});



}







async function loadQuestion(index){



if(currentQuestionIndex===index)
return;



currentQuestionIndex=index;

answered=false;

startTime=Date.now();



// load questions

const module =
await import("./questions.js");


const questions =
module.questions;



const q =
questions[index];



document.getElementById("waitingArea").style.display="none";

document.getElementById("questionArea").style.display="block";



document.getElementById("questionNumber").innerText =

`Question ${index+1}/${questions.length}`;



document.getElementById("questionText").innerText =

q.question;



const answerBox =
document.getElementById("answers");


answerBox.innerHTML="";



const colours=[

"red",
"blue",
"yellow",
"green"

];



q.options.forEach((option,i)=>{


const btn=document.createElement("button");


btn.innerText=option;


btn.className="answer "+colours[i];


btn.onclick=()=>submitAnswer(i);


answerBox.appendChild(btn);



});



startTimer();



}







function submitAnswer(choice){



if(answered)
return;


answered=true;



const reactionTime =

(Date.now()-startTime)/1000;



// Disable buttons

document
.querySelectorAll(".answer")
.forEach(btn=>{

btn.disabled=true;

});




set(

ref(database,

`games/${gamePin}/answers/${currentQuestionIndex}/${playerName}`),

{

answer:choice,

time:reactionTime,

submitted:true

}

);



document.getElementById("submitMessage").innerText =

"✅ Answer submitted! Waiting for results...";



}






function startTimer(){


let time=15;


document.getElementById("timer").innerText=time;



const interval=setInterval(()=>{


time--;


document.getElementById("timer").innerText=time;



if(time<=0){

clearInterval(interval);


if(!answered){

document.getElementById("submitMessage").innerText=

"⏰ Time's up!";

}

}


},1000);


}





</script>


</body>

</html>

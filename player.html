<!DOCTYPE html>
<html>

<head>

<title>Bollywood Quiz Player</title>

<style>

body {
    font-family:Arial;
    background:linear-gradient(135deg,#141E30,#243B55);
    color:white;
    text-align:center;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}


.box{
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    width:85%;
    max-width:500px;
}


input{

width:90%;
padding:15px;
margin:10px;
font-size:20px;
border-radius:10px;

}


button{

width:90%;
padding:15px;
margin:10px;
font-size:20px;
border-radius:10px;
border:none;
cursor:pointer;

}


.answer{

background:#333;
color:white;

}


#questionArea{

display:none;

}

</style>

</head>


<body>


<div class="box">


<h1>🎬 Bollywood Quiz</h1>


<div id="joinArea">


<h2>Join Game</h2>

<input id="pin" placeholder="Game PIN">

<input id="name" placeholder="Your Name">

<button id="join">
JOIN
</button>


</div>



<div id="waitingArea" style="display:none">

<h2>✅ Joined!</h2>

<p>Waiting for host to start...</p>

</div>



<div id="questionArea">

<h2 id="questionNumber"></h2>

<h2 id="question"></h2>


<div id="answers"></div>


</div>



</div>



<script type="module">


import { database } from "./firebase.js";


import {

ref,
set,
onValue

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";



let gamePin;
let playerName;



document.getElementById("join").onclick=()=>{


gamePin=document.getElementById("pin").value;

playerName=document.getElementById("name").value;



if(!gamePin || !playerName){

alert("Enter PIN and name");

return;

}



set(

ref(database,
"games/"+gamePin+"/players/"+playerName),

playerName

);



document.getElementById("joinArea").style.display="none";

document.getElementById("waitingArea").style.display="block";



// Listen for game start


const gameRef =
ref(database,"games/"+gamePin);



onValue(gameRef,(snapshot)=>{


const game=snapshot.val();



if(game && game.status==="playing"){


loadQuestion(game.currentQuestion);


}



});


};





function loadQuestion(index){


fetch("questions.js")

.then(()=>{


import("./questions.js")

.then(module=>{


const questions=module.questions;


const q=questions[index];



document.getElementById("waitingArea").style.display="none";

document.getElementById("questionArea").style.display="block";



document.getElementById("questionNumber").innerText=

"Question "+(index+1);



document.getElementById("question").innerText=

q.question;



const answers=document.getElementById("answers");


answers.innerHTML="";



q.options.forEach((option)=>{


const btn=document.createElement("button");


btn.className="answer";

btn.innerText=option;


answers.appendChild(btn);


});



});


});


}



</script>


</body>

</html>
